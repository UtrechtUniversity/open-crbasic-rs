name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The Python compiler is the specification; its checkout supplies the verdict goldens.
      OPENCRBASIC_PY: ${{ github.workspace }}/open-crbasic-py
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/checkout@v7
        with:
          repository: UtrechtUniversity/open-crbasic
          ref: c547b85c1880b8356e3adfb75f99236e23be0ffa  # the pinned spec commit (PORT_PROGRESS.md)
          path: open-crbasic-py
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-dependency-glob: open-crbasic-py/uv.lock
      - run: uv run --project "$OPENCRBASIC_PY" python tools/pydump.py
      - run: cargo test --release
      - run: python3 tools/crbc_compare.py
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  # main creates GitHub release v<version> with prebuilt crbc binaries when the version in
  # Cargo.toml has no release yet, after publishing that version to crates.io (README, "Releasing").
  release-check:
    needs: check
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release view "$tag" >/dev/null 2>&1 && echo new=false >> "$GITHUB_OUTPUT" || echo new=true >> "$GITHUB_OUTPUT"

  build:
    needs: release-check
    if: needs.release-check.outputs.new == 'true'
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --bin crbc --target ${{ matrix.target }}
      - shell: bash
        run: |
          name=crbc-${{ needs.release-check.outputs.tag }}-${{ matrix.target }}
          mkdir "$name" && cp README.md LICENSE "$name"/
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/${{ matrix.target }}/release/crbc.exe "$name"/ && 7z a "$name.zip" "$name"
          else
            cp target/${{ matrix.target }}/release/crbc "$name"/ && tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            crbc-*.tar.gz
            crbc-*.zip

  # Trusted publishing (OIDC) through the crates-io environment: no token is stored. Skipped when
  # the version is already on crates.io, so a re-run after a failed release job still works.
  publish:
    needs: [release-check, build]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          v="${TAG#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "open-crbasic-rs CI" "https://crates.io/api/v1/crates/opencrbasic/$v")
          [ "$code" = 200 ] && echo exists=true >> "$GITHUB_OUTPUT" || echo exists=false >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ needs.release-check.outputs.tag }}
      - if: steps.v.outputs.exists == 'false'
        uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth
      - if: steps.v.outputs.exists == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    needs: [release-check, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - run: cargo package --locked && cp target/package/*.crate "$RUNNER_TEMP/dist/"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ needs.release-check.outputs.tag }}" "$RUNNER_TEMP"/dist/* --target "$GITHUB_SHA" --generate-notes
